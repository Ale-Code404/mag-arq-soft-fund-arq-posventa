name: Release con PDF

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta del release al que se adjunta el PDF (por ejemplo v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/build-site

      - name: Instalar Playwright y Chromium
        run: |
          pip install -r requirements-pdf.txt
          python -m playwright install --with-deps chromium

      - name: Generar PDF
        run: python scripts/generar_pdf.py --version "$TAG" --out "dist/HLD-ADR-Posventa-$TAG.pdf"

      - name: Crear el release o adjuntar el PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PDF="dist/HLD-ADR-Posventa-$TAG.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PDF" --clobber
          else
            gh release create "$TAG" "$PDF" --title "$TAG" --generate-notes
          fi

      - name: Guardar PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: HLD-ADR-Posventa-${{ env.TAG }}
          path: dist/*.pdf
